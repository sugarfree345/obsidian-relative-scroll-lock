name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: relative-scroll-lock-strict
          path: |
            dist/*.zip
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/LICENSE
            dist/SHA256SUMS.txt
